[profile.default]
test-threads = 2

# Report every failure in one run rather than stopping at the first.
fail-fast = false

# The ignored runtime build test runs `lake build` and can take seconds on a
# cold cache; warn instead of terminating, and kill only after four periods
# without progress (~4 minutes).
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
# CI adds one automatic retry so a single runner hiccup does not fail the build.
fail-fast = false
retries = 1
