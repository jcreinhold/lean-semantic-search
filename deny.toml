# Configuration for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
# The path where the advisory database is cloned/fetched into.
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Alert when workspace dependencies are unmaintained without drowning the
# signal in every transitive dependency warning.
unmaintained = "workspace"
# The lint level for crates yanked from their source registry.
yanked = "warn"
# Advisory IDs intentionally ignored by this workspace.
ignore = []

[licenses]
# Permissive licenses compatible with this workspace's MIT OR Apache-2.0
# dual license. MPL-2.0 is accepted at file-level copyleft scope.
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.95
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
allow = []
# Pin the lean-rs crate family to a single semver-compatible line. lean-rs is
# 0.x, so 0.6.x and 0.7.x are incompatible: if an old transitive pin (e.g. a
# not-yet-upgraded consumer) drags a pre-0.7 copy into the graph alongside the
# 0.7 crates this workspace builds against, their shared types (e.g.
# lean_toolchain::LeanBuiltCapability) stop unifying and surface as a confusing
# deep E0308. Denying anything below the current floor makes that partial
# upgrade fail `cargo deny check` loudly instead. Raise the floor in lockstep
# on the next lean-rs major (0.x) bump.
deny = [
  { name = "lean-rs", version = "<0.7" },
  { name = "lean-rs-abi", version = "<0.7" },
  { name = "lean-rs-host", version = "<0.7" },
  { name = "lean-rs-interop-shims", version = "<0.7" },
  { name = "lean-rs-sys", version = "<0.7" },
  { name = "lean-rs-worker-child", version = "<0.7" },
  { name = "lean-rs-worker-parent", version = "<0.7" },
  { name = "lean-rs-worker-protocol", version = "<0.7" },
  { name = "lean-toolchain", version = "<0.7" },
]
highlight = "all"
multiple-versions = "warn"
skip = []
skip-tree = []
wildcards = "allow"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "warn"
unknown-registry = "warn"
