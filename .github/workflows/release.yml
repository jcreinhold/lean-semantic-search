name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all gates but skip the live crates.io publish and GitHub Release."
        type: boolean
        default: false
      packages:
        description: "Recovery only: missing crate names separated by spaces; empty publishes the workspace."
        type: string
        default: ""

# One release at a time; cancelling mid-publish would waste immutable crate versions.
concurrency:
  group: publish-lean-semantic-search
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Install elan + pinned Lean toolchain
        # elan resolves the toolchain from the working directory, not from
        # lake's `-d` argument, so set the default from lean/lean-toolchain.
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo doc --workspace --no-deps
        # rustdoc lints are invisible to clippy but degrade the docs.rs
        # pages this run is about to publish; a tagged version is immutable.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: cargo nextest run
        run: cargo nextest run --workspace --profile ci --locked
      - name: cargo deny check
        run: cargo deny check
      - name: lake build
        run: lake -d lean build
      - name: lake test
        run: lake -d lean test
      - name: runtime vendoring check
        run: scripts/check-runtime-vendoring.sh

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install elan + pinned Lean toolchain
        # `cargo publish` verifies each tarball by building it, and the runtime
        # crate's dependency tree builds `lean-rs-abi`, whose build script runs
        # `lean --print-prefix`. The publish runner needs the toolchain on PATH
        # just like the verify job; elan reads it from lean/lean-toolchain.
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify tag matches workspace version
        if: github.event_name == 'push' || inputs.dry_run != true
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="lean-semantic-search-contract"))')
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match workspace version (expected $expected). Bump Cargo.toml or re-tag."
            exit 1
          fi
          echo "Tag $tag matches workspace version $version"
      - name: Extract CHANGELOG section
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG section for [$version]; add one before tagging."
            exit 1
          fi
          echo "--- Release body ---"
          cat release-body.md
          echo "--- End release body ---"
      # Verify every tarball before the first upload, using Cargo's temporary
      # registry for unpublished siblings. External SDK crates must be published.
      - name: Verify workspace packages without uploading
        run: cargo package --workspace --locked

      - name: Publish workspace to crates.io
        if: inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLISH_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          selected=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c '
          import json, os, sys
          metadata = json.load(sys.stdin)
          members = set(metadata["workspace_members"])
          publishable = {p["name"] for p in metadata["packages"] if p["id"] in members and p.get("publish") != []}
          requested = os.environ.get("PUBLISH_PACKAGES", "").split()
          unknown = set(requested) - publishable
          if unknown:
              sys.exit("Unknown or unpublishable workspace packages: " + ", ".join(sorted(unknown)))
          if len(requested) != len(set(requested)):
              sys.exit("Duplicate workspace package selection")
          print(*requested, sep="\n")
          ')
          args=(--workspace)
          if [[ -n "$selected" ]]; then
            args=()
            while IFS= read -r package; do
              args+=("--package=$package")
            done <<< "$selected"
          fi
          cargo publish "${args[@]}" --locked
      - name: Create GitHub Release
        if: inputs.dry_run != true && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
